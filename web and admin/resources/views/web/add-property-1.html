  <!DOCTYPE html>
  <html lang="en">
  <head>
    <title>Shortlet Rental</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <header>
      <div class="container">
        <div class="header_inner">
          <div class="logo_wrap">
            <img src="img/logo.png" alt="">
          </div>
          <div class="account-sec ms-auto">
            <div class="become_host">
              <a href="#" class="btn secondary_btn" data-bs-toggle="modal" data-bs-target="#exampleModal"> <span class="icon"><img src="img/user.png" alt=""></span>Peter Parker</a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
        <section class="property-sec">
          <div class="container-fluid">
            <div class="row">
              <div class="col-md-6 grad-bg">
                  <h3>What kind of space will guest have?</h3>
              </div>
              <div class="col-md-6">
                <div class="property-cont">
                  <div class="property-list">
                    <label class="custom_radio_b">
                      <input type="radio" name="radio">
                      <span class="checkmark"></span>
                      <div class="property-inner">
                        <h3>National parks</h3>
                        <div class="property-img">
                          <img src="img/property-7.png" alt="Property">
                        </div>
                      </div>
                    </label>
                    <label class="custom_radio_b">
                      <input type="radio" name="radio">
                      <span class="checkmark"></span>
                       <div class="property-inner">
                          <h3>Tiny homes</h3>
                          <div class="property-img">
                            <img src="img/property-8.png" alt="Property">
                          </div>
                        </div>
                    </label>
                    <label class="custom_radio_b">
                      <input type="radio" name="radio">
                      <span class="checkmark"></span>
                       <div class="property-inner">
                          <h3>Islands</h3>
                          <div class="property-img">
                            <img src="img/property-9.png" alt="Property">
                          </div>
                        </div>
                    </label>
                    <label class="custom_radio_b">
                      <input type="radio" name="radio">
                      <span class="checkmark"></span>
                       <div class="property-inner">
                          <h3>Amazing pools</h3>
                          <div class="property-img">
                            <img src="img/property-10.png" alt="Property">
                          </div>
                        </div>
                    </label>
                    <label class="custom_radio_b">
                      <input type="radio" name="radio">
                      <span class="checkmark"></span>
                       <div class="property-inner">
                          <h3>Cabins</h3>
                          <div class="property-img">
                            <img src="img/property-11.png" alt="Property">
                          </div>
                        </div>
                    </label>
                    <label class="custom_radio_b">
                      <input type="radio" name="radio" checked="">
                      <span class="checkmark"></span>
                       <div class="property-inner">
                          <h3>Home</h3>
                          <div class="property-img">
                            <img src="img/property-12.png" alt="Property">
                          </div>
                        </div>
                    </label>
                  </div>
                  <div class="property-footer">
                    <div class="btn_group">
                      <a href="#" class="btn secondary_btn">Back</a>
                      <a href="#" class="btn primary_btn">Next</a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>  
    </main>     
    <script type="text/javascript" src="js/jquery.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/owl.carousel.js"></script>
    <script src="js/custom.js"></script>
  </body>
  </html>
