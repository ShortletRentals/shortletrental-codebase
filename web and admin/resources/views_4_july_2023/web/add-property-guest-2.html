  <!DOCTYPE html>
  <html lang="en">
  <head>
    <title>Shortlet Rental</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <header>
      <div class="container">
        <div class="header_inner">
          <div class="logo_wrap">
            <img src="img/logo.png" alt="">
          </div>
          <div class="account-sec ms-auto">
            <div class="become_host">
              <a href="#" class="btn secondary_btn" data-bs-toggle="modal" data-bs-target="#exampleModal"> <span class="icon"><img src="img/user.png" alt=""></span>Peter Parker</a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
        <section class="property-sec">
          <div class="container-fluid">
            <div class="row">
              <div class="col-md-6 grad-bg">
                  <h3>Should be Let guests know what your place has to offer</h3>
              </div>
              <div class="col-md-6">
                <div class="property-cont">
                  <div class="property-list">
                      <div class="multi-select">
                        <label class="custom_checkbox">
                          <input type="checkbox" checked="checked">
                          <span class="checkmark"></span>
                          <div class="property-bx">
                            <div class="pr-icon">
                              <img src="img/p-1.png" alt="">
                            </div>
                            <div class="pr-name">
                              <h5>Ocean view</h5>
                            </div>
                          </div>
                        </label>
                        <label class="custom_checkbox">
                          <input type="checkbox">
                          <span class="checkmark"></span>
                          <div class="property-bx">
                            <div class="pr-icon">
                              <img src="img/p-2.png" alt="">
                            </div>
                            <div class="pr-name">
                              <h5>Beach access – Beachfront</h5>
                            </div>
                          </div>
                        </label>
                        <label class="custom_checkbox">
                          <input type="checkbox">
                          <span class="checkmark"></span>
                          <div class="property-bx">
                            <div class="pr-icon">
                              <img src="img/p-3.png" alt="">
                            </div>
                            <div class="pr-name">
                              <h5>Wifi</h5>
                            </div>
                          </div>
                        </label>
                        <label class="custom_checkbox">
                          <input type="checkbox">
                          <span class="checkmark"></span>
                          <div class="property-bx">
                            <div class="pr-icon">
                              <img src="img/p-4.png" alt="">
                            </div>
                            <div class="pr-name">
                              <h5>Air conditioning</h5>
                            </div>
                          </div>
                        </label>
                        <label class="custom_checkbox">
                          <input type="checkbox">
                          <span class="checkmark"></span>
                          <div class="property-bx">
                            <div class="pr-icon">
                              <img src="img/p-5.png" alt="">
                            </div>
                            <div class="pr-name">
                              <h5>Private backyard</h5>
                            </div>
                          </div>
                        </label>
                        <label class="custom_checkbox">
                          <input type="checkbox">
                          <span class="checkmark"></span>
                          <div class="property-bx">
                            <div class="pr-icon">
                              <img src="img/p-1.png" alt="">
                            </div>
                            <div class="pr-name">
                              <h5>Sea view</h5>
                            </div>
                          </div>
                        </label>
                        <label class="custom_checkbox">
                          <input type="checkbox" checked="">
                          <span class="checkmark"></span>
                          <div class="property-bx">
                            <div class="pr-icon">
                              <img src="img/p-6.png" alt="">
                            </div>
                            <div class="pr-name">
                              <h5>Kitchen</h5>
                            </div>
                          </div>
                        </label>
                        <label class="custom_checkbox">
                          <input type="checkbox" checked="">
                          <span class="checkmark"></span>
                          <div class="property-bx">
                            <div class="pr-icon">
                              <img src="img/p-7.png" alt="">
                            </div>
                            <div class="pr-name">
                              <h5>Patio or balcony</h5>
                            </div>
                          </div>
                        </label>
                        <label class="custom_checkbox">
                          <input type="checkbox">
                          <span class="checkmark"></span>
                          <div class="property-bx">
                            <div class="pr-icon">
                              <img src="img/p-8.png" alt="">
                            </div>
                            <div class="pr-name">
                              <h5>Luggage drop-off allowed</h5>
                            </div>
                          </div>
                        </label>
                      </div>
                  </div>
                  <div class="property-footer">
                    <div class="btn_group">
                      <a href="#" class="btn secondary_btn">Back</a>
                      <a href="#" class="btn primary_btn">Next</a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>  
    </main>     
    <script type="text/javascript" src="js/jquery.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/owl.carousel.js"></script>
    <script src="js/custom.js"></script>
  </body>
  </html>
