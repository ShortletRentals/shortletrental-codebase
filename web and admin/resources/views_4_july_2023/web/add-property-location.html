  <!DOCTYPE html>
  <html lang="en">
  <head>
    <title>Shortlet Rental</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <header>
      <div class="container">
        <div class="header_inner">
          <div class="logo_wrap">
            <img src="img/logo.png" alt="">
          </div>
          <div class="account-sec ms-auto">
            <div class="become_host">
              <a href="#" class="btn secondary_btn" data-bs-toggle="modal" data-bs-target="#exampleModal"> <span class="icon"><img src="img/user.png" alt=""></span>Peter Parker</a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
        <section class="property-sec">
          <div class="container-fluid">
            <div class="row">
              <div class="col-md-6 grad-bg">
                  <h3>Where's your place located?</h3>
              </div>
              <div class="col-md-6">
                <div class="property-cont">
                  <div class="property-list">
                      <form class="booking-form">
                        <div class="row">
                          <div class="col-md-12">
                              <div class="form-group">
                                <input type="text" placeholder="Address (Line 1/2)" name="" class="form-control" />
                              </div>
                          </div>
                          <div class="col-md-6">
                              <div class="form-group">
                                <input type="text" placeholder="Country" name="" class="form-control" />
                              </div>
                          </div>
                          <div class="col-md-6">
                              <div class="form-group">
                                <input type="text" placeholder="City" name="" class="form-control" />
                              </div>
                          </div>
                          <div class="col-md-6">
                              <div class="form-group">
                                <input type="text" placeholder="Area" name="" class="form-control" />
                              </div>
                          </div>
                          <div class="col-md-6">
                              <div class="form-group">
                                <input type="text" placeholder="Landmark" name="" class="form-control" />
                              </div>
                          </div>
                        </div>
                      </form>
                      <div class="show-location-map">
                        <h3>Show your specific location</h3>
                        <div class="map-img">
                            <img src="img/contact-map.png" alt="Map">
                        </div>
                      </div>
                  </div>
                  <div class="property-footer">
                    <div class="btn_group">
                      <a href="#" class="btn secondary_btn">Back</a>
                      <a href="#" class="btn primary_btn">Next</a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>  
    </main>     
    <script type="text/javascript" src="js/jquery.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/owl.carousel.js"></script>
    <script src="js/custom.js"></script>
  </body>
  </html>
